repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
      - id: pytest
        name: pytest
        entry: sh -c "uv run pytest || [ $? -eq 5 ]"
        language: system
        always_run: true
        pass_filenames: false
