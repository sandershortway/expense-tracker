# Alembic configuration: one section per module database.
# Usage from the repository root, for example:
#   uv run alembic -n investments upgrade head
#   uv run alembic -n investments revision --autogenerate -m "add trades"
# The database URL comes from FINDASH_INVESTMENTS_DATABASE_URL (default
# sqlite:///.data/investments.db) unless sqlalchemy.url is set here.

[investments]
script_location = %(here)s/backend/src/findash/investments/migrations
file_template = %%(rev)s_%%(slug)s
