[project]
name = "expense-tracker"
version = "0.1.0"
description = "A personal financial dashboard."
requires-python = ">=3.15"
dependencies = ["findash"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pre-commit>=4",
    "pytest>=9,<10",
    "ruff>=0.16",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["backend"]

[tool.uv.sources]
findash = { workspace = true }

[tool.ruff]
line-length = 79
src = ["backend/src", "backend/tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.mypy]
strict = true
files = ["backend/src", "backend/tests"]
