[project]
name = "expense-tracker"
version = "0.1.0"
description = "A personal expense tracking application."
requires-python = ">=3.15"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit>=4",
    "pytest>=9,<10",
    "ruff>=0.16",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
